{% extends "common.html" %}
    {% block title %}G-Store{% endblock title %}
    {% load static %}
    {% block content %}
    {% load crispy_forms_tags %}
        
        <form action="" enctype="multipart/form-data" method="post" class="rounded col-md-4 m-auto border p-3 my-4">
            <h3 class="text-center my-2">Reset Password</h3>
            <p>Please enter your new password twice so we can verify you typed it in correctly.</p>
            {% csrf_token %}

            {{form|crispy}}

            <button class="btn btn-primary">Submit</button>

        </form>

    {% endblock %}
