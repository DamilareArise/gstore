{% extends "common.html" %}
    {% block title %}G-Store{% endblock title %}
    {% load static %}
    {% block content %}
    {% load crispy_forms_tags %}
        
        <form action="" enctype="multipart/form-data" method="post" class="rounded col-md-4 m-auto border p-3 my-4">
            <h3 class="text-center my-2">Login Form</h3>
            {% csrf_token %}

            {{form|crispy}}

            <button class="btn btn-primary">Log in</button>
            <hr>
            <div class="d-flex justify-content-between">
                <a href="{% url "password_reset" %}" class="text-black">Forgot Password?</a>
                <a href="{% url "signup" %}" class="text-black">Sign up</a>
            </div>

        </form>

    {% endblock %}
